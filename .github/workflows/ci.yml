name: CI

# Every push to a branch runs it; there is no pull_request trigger, because a private repository pays for its minutes and
# a pull request shows the checks of its head commit anyway. The release workflow calls it with full, which runs every
# job whatever changed and leaves building the images to the release itself.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every job whatever changed, and skip the image builds the caller does itself.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      images: ${{ steps.paths.outputs.images }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compare with the previous push
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          BEFORE: ${{ github.event.before }}
        run: |
          everything() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "images=true" >> "$GITHUB_OUTPUT"; }
          if [ "$FULL" = true ] || [ "$EVENT" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            everything
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          printf '%s\n' "$changed"
          touched() { if printf '%s\n' "$changed" | grep -qE "$1"; then echo true; else echo false; fi; }
          echo "code=$(touched '^(src|tests|addon|deploy/blender)/|^(global\.json|Directory\.Build\.props|\.editorconfig|Snail\.MCP\.Blender\.slnx|\.github/workflows/ci\.yml)$')" >> "$GITHUB_OUTPUT"
          echo "images=$(touched '^(src|addon|deploy)/|^(docs/theme/css/site\.css|\.mcp/server\.json|Directory\.Build\.props|\.editorconfig|README\.md|LICENSE|\.github/workflows/ci\.yml)$')" >> "$GITHUB_OUTPUT"

  tests:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: >-
          dotnet test -c Release --no-build
          --filter "FullyQualifiedName!~.Tests.Live."
          --logger "trx;LogFileName=tests.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Test summary
        if: success() || failure()
        run: python3 .github/scripts/test_summary.py "Tests" "TestResults/**/*.trx"

      - name: Coverage summary
        if: success() || failure()
        run: |
          dotnet tool update --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:MarkdownSummaryGithub
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: TestResults
          retention-days: 7
          if-no-files-found: ignore

  addon:
    name: Lint the add-on
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.16.6

      - name: Lint
        run: ruff check addon tools

      - name: The declared parameters are the ones the handlers read
        run: python tools/parameters_from_source.py

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Generate the tool reference
        run: dotnet run -c Release --project docs/generator -- docs/content

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build the site
        run: mkdocs build --strict --config-file docs/mkdocs.yml

  live:
    name: Live tests against Blender
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Read the Blender the image uses
        id: blender
        run: |
          argument() { sed -n "s/^ARG $1=//p" deploy/blender/Dockerfile; }
          {
            echo "version=$(argument BLENDER_VERSION)"
            echo "sha256=$(argument BLENDER_SHA256)"
            echo "mirror=$(argument BLENDER_MIRROR)"
          } >> "$GITHUB_OUTPUT"

      - name: Install the libraries Blender links against
        run: |
          sudo apt-get update
          xargs -a deploy/blender/packages.txt sudo apt-get install -y --no-install-recommends

      - name: Restore Blender from the cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/blender
          key: blender-${{ steps.blender.outputs.version }}-${{ steps.blender.outputs.sha256 }}

      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.blender.outputs.version }}
          SHA256: ${{ steps.blender.outputs.sha256 }}
          MIRROR: ${{ steps.blender.outputs.mirror }}
        run: |
          curl -fsSL "$MIRROR/Blender${VERSION%.*}/blender-$VERSION-linux-x64.tar.xz" -o blender.tar.xz
          echo "$SHA256  blender.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/blender"
          tar -xJf blender.tar.xz -C "$HOME/blender" --strip-components=1
          rm blender.tar.xz

      - name: Check that Blender finds its libraries
        run: |
          missing="$(ldd "$HOME/blender/blender" | grep 'not found' || true)"
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          "$HOME/blender/blender" -b --factory-startup --version | head -n 1
          echo "SNAIL_MCP_BLENDER_TESTS_BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"

      - name: Live tests
        run: >-
          dotnet test -c Release
          --filter "FullyQualifiedName~.Tests.Live."
          --logger "trx;LogFileName=live.trx"
          --results-directory TestResults

      - name: Test summary
        if: success() || failure()
        run: python3 .github/scripts/test_summary.py "Live tests" "TestResults/**/*.trx" --require-every-test

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-results
          path: TestResults
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: Build ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images == 'true' && !inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: s3l-blender
            dockerfile: deploy/blender/Dockerfile
          - image: s3l-blender-mcp
            dockerfile: deploy/mcp/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
