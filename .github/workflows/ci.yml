name: CI

# Every push to a branch runs it; there is no pull_request trigger, because a private repository pays for its minutes and
# a pull request shows the checks of its head commit anyway. The release workflow calls it with full, which runs every
# job whatever changed and leaves building the images to the release itself. The build and tests are the shared server
# CI of Snail.Sdk; the add-on, the site, the live tests against a real Blender and the Blender image are this server's
# own. The server's image is image.yml, through the shared image workflow.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every job whatever changed, and skip the image builds the caller does itself.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      images: ${{ steps.paths.outputs.images }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compare with the previous push
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          BEFORE: ${{ github.event.before }}
        run: |
          everything() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "images=true" >> "$GITHUB_OUTPUT"; }
          if [ "$FULL" = true ] || [ "$EVENT" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            everything
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          printf '%s\n' "$changed"
          touched() { if printf '%s\n' "$changed" | grep -qE "$1"; then echo true; else echo false; fi; }
          echo "code=$(touched '^(src|tests|addon|deploy/blender)/|^(global\.json|Directory\.Build\.props|\.editorconfig|Snail\.MCP\.Blender\.slnx|\.github/workflows/ci\.yml)$')" >> "$GITHUB_OUTPUT"
          echo "images=$(touched '^(src|addon|deploy)/|^(global\.json|\.mcp/server\.json|Directory\.Build\.props|\.editorconfig|README\.md|LICENSE|\.github/workflows/ci\.yml)$')" >> "$GITHUB_OUTPUT"

  # The shared server CI of Snail.Sdk: the tests, the conformance check, the tool reference the build writes, and the
  # framework-dependent publication asked over stdio. The live tests skip themselves there, as no Blender is installed.
  ci:
    uses: orldev/Snail.Sdk/.github/workflows/mcp-ci.yml@v1
    with:
      test-filter: FullyQualifiedName!~.Tests.Live.
      project: src
      contract-variable: SNAIL_BLENDER_SERVER
      contract-filter: FullyQualifiedName~StdioContract

  addon:
    name: Lint the add-on
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install ruff and pytest
        run: pip install ruff==0.17.3 pytest==9.2.0

      - name: Lint
        run: ruff check addon tools tests/addon

      # The add-on is otherwise proven only by the live tests against a real Blender, which take forty minutes; what touches no
      # bpy is tested here in a second, and the memory a render budget is built on is exactly that kind of code.
      - name: Test what the add-on does without Blender
        run: python -m pytest tests/addon -q

      - name: The declared parameters are the ones the handlers read
        run: python tools/parameters_from_source.py

  # The site as the release publishes it, built strictly on every push: a broken link fails here, not on the release tag.
  # The tool reference it shows is committed, and the shared CI checks it is the one the build writes.
  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # The SnailSite target of Snail.Sdk: the theme and the MkDocs it carries, over docs/mkdocs.yml.
      - name: Build the site
        run: dotnet msbuild src/Snail.MCP.Blender.csproj -t:SnailSite -nologo

  live:
    name: Live tests against Blender
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Read the Blender the image uses
        id: blender
        run: |
          argument() { sed -n "s/^ARG $1=//p" deploy/blender/Dockerfile; }
          {
            echo "version=$(argument BLENDER_VERSION)"
            echo "sha256=$(argument BLENDER_SHA256)"
            echo "mirror=$(argument BLENDER_MIRROR)"
          } >> "$GITHUB_OUTPUT"

      - name: Install the libraries Blender links against
        run: |
          sudo apt-get update
          xargs -a deploy/blender/packages.txt sudo apt-get install -y --no-install-recommends

      - name: Restore Blender from the cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/blender
          key: blender-${{ steps.blender.outputs.version }}-${{ steps.blender.outputs.sha256 }}

      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.blender.outputs.version }}
          SHA256: ${{ steps.blender.outputs.sha256 }}
          MIRROR: ${{ steps.blender.outputs.mirror }}
        run: |
          curl -fsSL "$MIRROR/Blender${VERSION%.*}/blender-$VERSION-linux-x64.tar.xz" -o blender.tar.xz
          echo "$SHA256  blender.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/blender"
          tar -xJf blender.tar.xz -C "$HOME/blender" --strip-components=1
          rm blender.tar.xz

      - name: Check that Blender finds its libraries
        run: |
          missing="$(ldd "$HOME/blender/blender" | grep 'not found' || true)"
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          "$HOME/blender/blender" -b --factory-startup --version | head -n 1
          echo "SNAIL_MCP_BLENDER_TESTS_BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"

      - name: Live tests
        run: >-
          dotnet test -c Release
          --filter "FullyQualifiedName~.Tests.Live."
          --logger "trx;LogFileName=live.trx"
          --results-directory TestResults

      - name: Test summary
        if: success() || failure()
        run: python3 .github/scripts/test_summary.py "Live tests" "TestResults/**/*.trx" --require-every-test

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-results
          path: TestResults
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: Build ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images == 'true' && !inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: s3l-blender
            dockerfile: deploy/blender/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
