# Every two months, on the first day of an odd month at 06:00 UTC, pull requests for what this repository pins: the actions
# in the workflows, the NuGet packages, the .NET SDK in global.json, the base images of the two Dockerfiles and the
# documentation toolchain. There is no bimonthly interval, so a cron names the months. Security updates do not wait for
# it. Blender is pinned by version and SHA-256 in deploy/blender/Dockerfile, which Dependabot does not read, so it moves
# by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1 1,3,5,7,9,11 *"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directories: ["/src", "/tests", "/docs/generator"]
    schedule:
      interval: cron
      cronjob: "0 6 1 1,3,5,7,9,11 *"
    groups:
      model-context-protocol:
        patterns: ["ModelContextProtocol*"]
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*", "Microsoft.Extensions.TimeProvider.Testing"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1 1,3,5,7,9,11 *"

  - package-ecosystem: docker
    directories: ["/deploy/blender", "/deploy/mcp"]
    schedule:
      interval: cron
      cronjob: "0 6 1 1,3,5,7,9,11 *"

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: cron
      cronjob: "0 6 1 1,3,5,7,9,11 *"
