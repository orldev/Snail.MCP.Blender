# Every two months, on the first day of an odd month at 06:00 UTC, pull requests for what this repository pins: the actions
# in the workflows, the NuGet packages and the base images of the two Dockerfiles. There is no bimonthly interval, so a
# cron names the months. Security updates do not wait for it. Blender is pinned by version and SHA-256 in
# deploy/blender/Dockerfile, which Dependabot does not read, so it moves by hand; the site's toolchain lives in the shared
# docs workflow of Snail.Sdk.
#
# The .NET SDK band is the standard's: global.json is shared by every Snail repository and the conformance check compares
# it by value, so it is raised by hand, in Snail.Sdk first, together with the image the server is built in. A multi-ecosystem
# group meant to move the two at once brought a pull request that moved global.json alone, the one change that fails with
# exit code 155. Dependabot therefore follows the build image only inside the band, and the runtime image freely.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1 1,3,5,7,9,11 *"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directories: ["/src", "/tests", "/benchmarks"]
    schedule:
      interval: cron
      cronjob: "0 6 1 1,3,5,7,9,11 *"
    groups:
      model-context-protocol:
        patterns: ["ModelContextProtocol*"]
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*", "Microsoft.Extensions.TimeProvider.Testing"]

  - package-ecosystem: docker
    directory: /deploy/mcp
    schedule:
      interval: cron
      cronjob: "0 6 1 1,3,5,7,9,11 *"
    groups:
      dotnet-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*dotnet/sdk"
        versions: [">= 10.0.400"]

  # Ubuntu stays on its LTS: Blender is a self-contained archive and gains nothing from a newer base, and the GNU tar of 26.04
  # cannot unpack it in an amd64 build emulated on a Mac, where these images are checked.
  - package-ecosystem: docker
    directory: /deploy/blender
    schedule:
      interval: cron
      cronjob: "0 6 1 1,3,5,7,9,11 *"
    ignore:
      - dependency-name: ubuntu
